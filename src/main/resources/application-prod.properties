# Production requires an explicit APP_CORS_ALLOWED_ORIGINS value in the hosting dashboard.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
server.port=${PORT:8080}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}

# Hosted services use HTTPS; cross-site session cookies must be sent with API requests.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Validate the schema during normal production runs. For the first deployment only,
# set SPRING_JPA_HIBERNATE_DDL_AUTO=update in the host environment to initialize it,
# then remove that override so this safer setting takes effect.
spring.jpa.hibernate.ddl-auto=validate
