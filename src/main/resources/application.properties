server.port=8080

# Database: MySQL. Values come from environment variables, or run with the "aiven" profile (see application-aiven.properties).
# The defaults suit a local MySQL. Set DB_SSL_MODE=DISABLED for a local MySQL without SSL.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:defaultdb}?sslMode=${DB_SSL_MODE:REQUIRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Login sessions. 6h so a full 3-hour test never loses its session between start and submit.
server.servlet.session.timeout=6h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Comma-separated emails that are always administrators. The first account to register is also made an administrator.
app.admin-emails=${ADMIN_EMAILS:}
